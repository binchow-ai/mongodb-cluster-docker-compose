version: '3.8'

networks:
  mongodb-cluster:
    driver: bridge

services:
  ## Router
  router01:
    image: mongodb/mongodb-community-server:8.2-ubi8
    container_name: router-01
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - ./scripts:/scripts
      - ./data/mongos/mongos01/data:/data/db
      - ./data/mongos/mongos01/log:/var/log/mongodb
      - ./data/mongos/mongos01/mongod.conf:/etc/mongod.conf
    entrypoint: ["/scripts/entrypoint-route.sh"]
    networks:
      - mongodb-cluster
    depends_on:
      - configsvr01
      - configsvr02
      - configsvr03
      - shard01-a
      - shard02-a

  ## Config Servers 
  configsvr01:
    image: mongodb/mongodb-community-server:8.2-ubi8
    container_name: mongo-config-01
    volumes:
      - ./scripts:/scripts
      - ./data/configsvr/cfg1/data:/data/db
      - ./data/configsvr/cfg1/log:/var/log/mongodb
      - ./data/configsvr/mongod.conf:/etc/mongod.conf
    restart: always
    entrypoint: ["/scripts/entrypoint-configserver.sh"]
    networks:
      - mongodb-cluster

  configsvr02:
    image: mongodb/mongodb-community-server:8.2-ubi8
    container_name: mongo-config-02
    command: mongod  --config /etc/mongod.conf  --configsvr --replSet rs-config-server 
    volumes:
      - ./scripts:/scripts
      - ./data/configsvr/cfg2/data:/data/db
      - ./data/configsvr/cfg2/log:/var/log/mongodb
      - ./data/configsvr/mongod.conf:/etc/mongod.conf
    restart: always
    networks:
      - mongodb-cluster

  configsvr03:
    image: mongodb/mongodb-community-server:8.2-ubi8
    container_name: mongo-config-03
    command: mongod  --config /etc/mongod.conf --configsvr --replSet rs-config-server
    volumes:
      - ./scripts:/scripts
      - ./data/configsvr/cfg3/data:/data/db
      - ./data/configsvr/cfg3/log:/var/log/mongodb
      - ./data/configsvr/mongod.conf:/etc/mongod.conf
    restart: always
    networks:
      - mongodb-cluster

  ## Shards
  shard01-a:
    image: mongodb/mongodb-community-server:8.2-ubi8
    container_name: shard-01-node-a
    volumes:
      - ./scripts:/scripts
      - ./data/shards/shard1-a/data:/data/db
      - ./data/shards/shard1-a/log:/var/log/mongodb
      - ./data/shards/mongod-shard1.conf:/etc/mongod.conf
    restart: always
    entrypoint: ["/bin/sh", "/scripts/entrypoint-shard01.sh"]
    networks:
      - mongodb-cluster

  shard01-b:
    image: mongodb/mongodb-community-server:8.2-ubi8
    container_name: shard-01-node-b
    command: mongod  --port 27017 --shardsvr --replSet rs-shard-01
    volumes:
      - ./scripts:/scripts
      - ./data/shards/shard1-b/data:/data/db
      - ./data/shards/shard1-b/log:/var/log/mongodb
      - ./data/shards/mongod-shard1.conf:/etc/mongod.conf    
    restart: always
    networks:
      - mongodb-cluster

  shard01-c:
    image: mongodb/mongodb-community-server:8.2-ubi8
    container_name: shard-01-node-c
    command: mongod  --port 27017 --shardsvr --replSet rs-shard-01
    volumes:
      - ./scripts:/scripts
      - ./data/shards/shard1-c/data:/data/db
      - ./data/shards/shard1-c/log:/var/log/mongodb
      - ./data/shards/mongod-shard1.conf:/etc/mongod.conf
    restart: always
    networks:
      - mongodb-cluster

  shard02-a:
    image: mongodb/mongodb-community-server:8.2-ubi8
    container_name: shard-02-node-a
    volumes:
      - ./scripts:/scripts
      - ./data/shards/shard2-a/data:/data/db
      - ./data/shards/shard2-a/log:/var/log/mongodb
      - ./data/shards/mongod-shard2.conf:/etc/mongod.conf
    restart: always
    entrypoint: ["/bin/sh", "/scripts/entrypoint-shard02.sh"]
    networks:
      - mongodb-cluster

  shard02-b:
    image: mongodb/mongodb-community-server:8.2-ubi8
    container_name: shard-02-node-b
    command: mongod  --port 27017 --shardsvr --replSet rs-shard-02
    volumes:
      - ./scripts:/scripts
      - ./data/shards/shard2-b/data:/data/db
      - ./data/shards/shard2-b/log:/var/log/mongodb
      - ./data/shards/mongod-shard2.conf:/etc/mongod.conf
    restart: always
    networks:
      - mongodb-cluster

  shard02-c:
    image: mongodb/mongodb-community-server:8.2-ubi8
    container_name: shard-02-node-c
    command: mongod  --port 27017 --shardsvr --replSet rs-shard-02
    volumes:
      - ./scripts:/scripts
      - ./data/shards/shard2-c/data:/data/db
      - ./data/shards/shard2-c/log:/var/log/mongodb
      - ./data/shards/mongod-shard2.conf:/etc/mongod.conf
    restart: always
    networks:
      - mongodb-cluster

  